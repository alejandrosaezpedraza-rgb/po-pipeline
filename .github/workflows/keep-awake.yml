# Visits the online demo every 10 minutes so Render's free plan doesn't put it to sleep
# (it sleeps after 15 minutes without visitors). Off until the DEMO_URL repository
# variable is set, e.g. https://po-intake-demo.onrender.com
#
# GitHub may start scheduled runs late when it is busy, and it pauses schedules in a
# repository with no activity for 60 days; re-enable it under Actions if that happens.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the demo's health check
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL is not set (Settings > Secrets and variables > Actions > Variables). Nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "${DEMO_URL%/}/healthz"
          echo " - demo is awake"
